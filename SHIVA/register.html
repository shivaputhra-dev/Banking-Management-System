<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Register - Shiva Putra International Bank
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <div class="logo-area">

        <img src="images/bank-logo.png"
             alt="Bank Logo">

        <div>
            <h2>Shiva Putra</h2>
            <p>International Bank</p>
        </div>

    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="login.html">Login</a>

    </nav>

</header>

<section class="form-section">

    <div class="form-box">

        <img src="images/bank-logo.png"
             class="form-logo"
             alt="Bank Logo">

        <h1>Create Bank Account</h1>

        <form onsubmit="registerUser(event)">

            <label>Full Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter full name"
                   required>

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter email"
                   required>

            <label>Phone Number</label>

            <input type="tel"
                   id="phone"
                   placeholder="Enter phone number"
                   required>

            <label>Address</label>

            <textarea id="address"
                      placeholder="Enter address"
                      required></textarea>

            <label>Account Type</label>

            <select id="accountType"
                    required>

                <option value="">
                    Select Account
                </option>

                <option>
                    Savings Account
                </option>

                <option>
                    Current Account
                </option>

            </select>

            <label>Password</label>

            <input type="password"
                   id="password"
                   placeholder="Create password"
                   required>

            <label>Confirm Password</label>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm password"
                   required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
        </p>

        <a href="login.html">
            Login Here
        </a>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
